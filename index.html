<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <button id="themeBtn" class="theme-btn" title="Toggle theme" aria-label="Toggle theme">☾</button>
    <main class="profile">

      <header class="profile-header">
        <div class="pfp-wrap" id="pfpWrap"></div>
        <div class="info-box">
          <span class="user-tab" id="username"></span>
          <p class="info" id="bio"></p>
        </div>
      </header>

      <nav class="socials" id="socials"></nav>

      <section class="motto-box">
        <p class="motto" id="motto"></p>
      </section>

      <footer class="footer" id="footer"></footer>

    </main>
  </div>
  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
